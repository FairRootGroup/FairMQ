spack:
  specs:
    - "fairlogger@2.2.0 ^fmt@:11"
    - "boost@1.87 +container +program_options +filesystem +date_time +regex"
    - "libzmq@4.1.4:"
    - ninja
    - "cmake@3.15:"

  concretizer:
    targets:
      granularity: generic
    reuse:
      # the shared buildcache also holds the ThreadSanitizer-instrumented
      # libzmq/libsodium of the tsan environment; reusing them here would
      # link an instrumented library into uninstrumented binaries
      exclude:
        - "libzmq cflags=-fsanitize=thread"
        - "libsodium cflags=-fsanitize=thread"

  packages:
    all:
      require:
        - target=x86_64_v3

  mirrors:
    ghcr-buildcache:
      url: oci://ghcr.io/fairrootgroup/fairmq-spack-buildcache
      signed: false
