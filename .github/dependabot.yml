version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/docs"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      docs:
        patterns:
          - "*"
